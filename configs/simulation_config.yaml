simulation:

  random_seed: 42

  duration_seconds: 300

  timestep_seconds: 0.1

  vehicle:

    initial_altitude: 5000.0

    initial_speed: 150.0

    max_speed: 250.0

    min_speed: 80.0

    max_acceleration: 10.0

    max_turn_rate: 30.0

    max_altitude: 10000.0

    min_altitude: 500.0


  environment:

    sensor_noise: 0.05

    communication_quality: 1.0

    rf_interference_level: 0.0

    environmental_risk: 0.1


  safety:

    minimum_altitude: 500.0

    maximum_altitude: 10000.0

    minimum_speed: 80.0

    maximum_speed: 250.0

    maximum_acceleration: 10.0

    maximum_turn_rate: 30.0


  scenarios:

    number_of_scenarios: 1000

    seed_start: 42