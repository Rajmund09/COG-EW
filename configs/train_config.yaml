
# COG-EW reinforcement-learning configuration
# Interface dimensions aligned with the current simulation environment.

rl_algorithm: "PPO"

ppo:
  learning_rate_actor: 3.0e-4
  learning_rate_critic: 1.0e-3
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ppo_epochs: 10
  batch_size: 64
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 0.5

network:
  state_dim: 16
  hidden_dims: [256, 256, 128]

  # Current environment action vector has four values:
  # two guidance-related entries, one mode entry, one power entry.
  guidance_action_dim: 2
  ew_action_dim: 2
  total_action_dim: 4

training:
  total_timesteps: 1000000
  checkpoint_interval: 50000
  curriculum_stages: 3
  seed: 42
