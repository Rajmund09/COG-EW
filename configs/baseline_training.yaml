experiment:
  name: radioml_cnn_baseline
  seed: 42

dataset:
  name: RadioML 2018.01A

  classes: 24

  signal_length: 1024

  channels: 2

  snr_levels:
    - -20
    - -10
    - 0
    - 10
    - 20

training:
  epochs: 10

  batch_size: 64

  learning_rate: 0.001

  weight_decay: 0.0001

  num_workers: 0

  early_stopping_patience: 3

optimizer:
  name: AdamW

scheduler:
  name: ReduceLROnPlateau

  factor: 0.5

  patience: 2

paths:
  checkpoints: D:/COG-EW/models/checkpoints

  reports: D:/COG-EW/reports

  figures: D:/COG-EW/reports/figures